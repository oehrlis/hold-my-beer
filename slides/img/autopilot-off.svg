<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">AI is not an autopilot</title>
  <desc id="d">Cockpit panel: a toggle switch labelled AUTOPILOT with the lever firmly in OFF, the OFF lamp lit. A terminal display shows "AI: suggestion ready", a checklist has review ticked, and a gloved hand keeps a firm grip on the control stick.</desc>
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#EF6C00"/>
    </linearGradient>
    <clipPath id="panel"><rect x="2" y="2" width="596" height="396" rx="24"/></clipPath>
    <clipPath id="ai"><circle cx="338" cy="272" r="46"/></clipPath>
  </defs>

  <!-- own panel: works on white and on navy slides -->
  <rect x="2" y="2" width="596" height="396" rx="24" fill="#1E3446"/>

  <g font-family="Helvetica, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">

    <!-- AUTOPILOT switch module -->
    <rect x="30" y="30" width="230" height="210" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#A8C8D8" stroke-width="3.5"/>
    <g fill="none" stroke="#A8C8D8" stroke-width="2">
      <circle cx="46" cy="46" r="5"/><path d="M43 49l6-6"/>
      <circle cx="244" cy="46" r="5"/><path d="M241 43l6 6"/>
      <circle cx="46" cy="224" r="5"/><path d="M43 221l6 6"/>
      <circle cx="244" cy="224" r="5"/><path d="M241 227l6-6"/>
    </g>
    <text x="145" y="74" text-anchor="middle" font-size="25" font-weight="bold" letter-spacing="4" fill="#F0F5F8">AUTOPILOT</text>

    <!-- toggle: base nut, slot, lever pointing down to OFF -->
    <rect x="66" y="94" width="58" height="126" rx="29" fill="#1E3446" stroke="#A8C8D8" stroke-width="3"/>
    <path d="M95 108v98" stroke="#A8C8D8" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="95" cy="150" r="20" fill="#A8C8D8" stroke="#F0F5F8" stroke-width="3"/>
    <circle cx="95" cy="150" r="8" fill="#1E3446"/>
    <path d="M95 150L95 196" stroke="#F0F5F8" stroke-width="12"/>
    <circle cx="95" cy="200" r="12" fill="#F0F5F8" stroke="#A8C8D8" stroke-width="3"/>

    <!-- ON: dim -->
    <circle cx="160" cy="118" r="10" fill="#1E3446" stroke="#A8C8D8" stroke-width="3"/>
    <text x="180" y="127" font-size="24" font-weight="bold" fill="#A8C8D8" fill-opacity="0.75">ON</text>
    <!-- OFF: lit -->
    <circle cx="160" cy="194" r="17" fill="#EF6C00" fill-opacity="0.25"/>
    <circle cx="160" cy="194" r="10" fill="#FFC24A" stroke="#EF6C00" stroke-width="3"/>
    <text x="180" y="203" font-size="26" font-weight="bold" fill="#FFC24A">OFF</text>

    <!-- checklist -->
    <rect x="30" y="258" width="230" height="112" rx="16" fill="#F0F5F8" stroke="#A8C8D8" stroke-width="3"/>
    <rect x="114" y="250" width="62" height="16" rx="5" fill="#A8C8D8" stroke="#1E3446" stroke-width="2.5"/>
    <g font-size="20" font-weight="bold" fill="#1E3446">
      <rect x="52" y="279" width="22" height="22" rx="4" fill="none" stroke="#1E3446" stroke-width="3"/>
      <path d="M56 290l6 6 14-17" fill="none" stroke="#EF6C00" stroke-width="4"/>
      <text x="88" y="297">review</text>
      <rect x="52" y="321" width="22" height="22" rx="4" fill="none" stroke="#1E3446" stroke-width="3"/>
      <text x="88" y="339">test</text>
    </g>
    <text x="246" y="339" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="15" fill="#B85200">pending</text>

    <!-- terminal display -->
    <rect x="282" y="30" width="288" height="122" rx="14" fill="#1E3446" stroke="#A8C8D8" stroke-width="3.5"/>
    <rect x="294" y="42" width="264" height="98" rx="8" fill="#FFFFFF" fill-opacity="0.06"/>
    <g fill="#A8C8D8">
      <circle cx="306" cy="56" r="4"/><circle cx="320" cy="56" r="4" fill-opacity="0.6"/><circle cx="334" cy="56" r="4" fill-opacity="0.35"/>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-weight="bold">
      <text x="306" y="92" font-size="19" fill="#EF6C00">&gt;_</text>
      <text x="338" y="92" font-size="18" fill="#FFC24A">AI: suggestion</text>
      <text x="338" y="120" font-size="18" fill="#FFC24A">ready</text>
      <rect x="402" y="105" width="11" height="19" fill="#F0F5F8"/>
    </g>

    <!-- attitude indicator: level flight, hands on -->
    <g clip-path="url(#ai)">
      <rect x="288" y="222" width="100" height="52" fill="#A8C8D8"/>
      <rect x="288" y="274" width="100" height="52" fill="#B85200"/>
      <path d="M288 274h100" stroke="#FFC24A" stroke-width="3"/>
      <path d="M326 252h24M330 296h16M322 262h32M322 286h32" stroke="#1E3446" stroke-width="2" stroke-opacity="0.5"/>
    </g>
    <circle cx="338" cy="272" r="46" fill="none" stroke="#A8C8D8" stroke-width="3.5"/>
    <circle cx="338" cy="272" r="54" fill="none" stroke="#A8C8D8" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M302 274h22M352 274h22M328 274l10 9 10-9" fill="none" stroke="#F0F5F8" stroke-width="5"/>
    <circle cx="338" cy="274" r="3.5" fill="#F0F5F8"/>
    <path d="M338 222v8" stroke="#FFC24A" stroke-width="3"/>

    <!-- control stick: base, gaiter, shaft, grip -->
    <ellipse cx="452" cy="364" rx="96" ry="16" fill="#A8C8D8"/>
    <path d="M412 362L424 316h56l12 46z" fill="#1E3446" stroke="#A8C8D8" stroke-width="3.5"/>
    <path d="M419 342h66M422 328h60" stroke="#A8C8D8" stroke-width="2.5" stroke-opacity="0.7"/>
    <path d="M452 316V282" stroke="#F0F5F8" stroke-width="14"/>
    <rect x="422" y="176" width="60" height="112" rx="28" fill="#1E3446" stroke="#A8C8D8" stroke-width="3.5"/>
    <rect x="440" y="168" width="24" height="14" rx="6" fill="#EF6C00" stroke="#1E3446" stroke-width="3"/>

    <!-- gloved hand gripping the stick, sleeve to the right -->
    <g clip-path="url(#panel)">
      <path d="M516 226L604 208V284L522 276z" fill="#EF6C00" stroke="#1E3446" stroke-width="3.5"/>
      <path d="M534 223L540 278" stroke="#B85200" stroke-width="6"/>
    </g>
    <path d="M526 270c-10 22-36 30-62 26l-4-90c20-12 52-14 70-2l6 26z" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
    <g fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5">
      <rect x="410" y="210" width="62" height="20" rx="10"/>
      <rect x="408" y="230" width="64" height="20" rx="10"/>
      <rect x="410" y="250" width="62" height="20" rx="10"/>
      <rect x="414" y="270" width="56" height="18" rx="9"/>
    </g>
    <path d="M470 206c-8-10-6-24 2-28 8-3 16 4 18 14l2 14" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
    <path d="M530 268c-4 14-10 22-18 26" fill="none" stroke="#1E3446" stroke-width="3"/>
    <path d="M522 226c-14 0-26 4-30 12" fill="none" stroke="#A8C8D8" stroke-width="3"/>
  </g>
  <rect x="2" y="2" width="596" height="396" rx="24" fill="none" stroke="#A8C8D8" stroke-width="2"/>
</svg>
