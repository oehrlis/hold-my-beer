<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d" lang="en">
  <title id="t">Expanding brain: from SELECT * to the plan check</title>
  <desc id="d">Five levels, each with a brighter beer mug: SELECT *, SELECT col1, col2, reads the execution plan, asks the AI for the plan, asks the AI and reads the plan - the last level glows gold.</desc>
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC24A"/><stop offset="1" stop-color="#EF6C00"/></linearGradient>
    <radialGradient id="gb"><stop offset="0" stop-color="#A8C8D8" stop-opacity="0.9"/><stop offset="1" stop-color="#A8C8D8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gw"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="0.5" stop-color="#A8C8D8" stop-opacity="0.7"/><stop offset="1" stop-color="#A8C8D8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gg"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="0.35" stop-color="#FFC24A" stop-opacity="0.95"/><stop offset="1" stop-color="#EF6C00" stop-opacity="0"/></radialGradient>
    <g id="mug">
      <path d="M330 220 C 410 220, 410 360, 330 360" fill="none" stroke="#A8C8D8" stroke-width="26" stroke-linecap="round"/>
      <path d="M150 175 L150 395 A90 24 0 0 0 330 395 L330 175 Z" fill="url(#beer)"/>
      <path d="M150 175 L150 395 A90 24 0 0 0 330 395 L330 175" fill="none" stroke="#A8C8D8" stroke-width="12" stroke-linejoin="round"/>
      <text x="240" y="330" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="72" font-weight="bold" fill="#1E3446">&gt;_</text>
      <g fill="#F0F5F8">
        <ellipse cx="240" cy="175" rx="96" ry="26"/>
        <circle cx="168" cy="160" r="30"/><circle cx="210" cy="145" r="36"/><circle cx="258" cy="140" r="38"/>
        <circle cx="304" cy="156" r="32"/><circle cx="335" cy="174" r="18"/>
        <path d="M150 170 L150 222 A12 12 0 0 0 174 222 L174 180 Z"/>
      </g>
    </g>
    <clipPath id="c0"><rect x="384" y="16" width="200" height="70" rx="12"/></clipPath>
    <clipPath id="c1"><rect x="384" y="90" width="200" height="70" rx="12"/></clipPath>
    <clipPath id="c2"><rect x="384" y="164" width="200" height="70" rx="12"/></clipPath>
    <clipPath id="c3"><rect x="384" y="238" width="200" height="70" rx="12"/></clipPath>
    <clipPath id="c4"><rect x="384" y="312" width="200" height="70" rx="12"/></clipPath>
  </defs>
  <rect x="2" y="2" width="596" height="396" rx="24" fill="#1E3446" stroke="#A8C8D8" stroke-width="3"/>
  <!-- level 1 -->
  <rect x="16" y="16" width="356" height="70" rx="12" fill="#F0F5F8"/>
  <text x="36" y="59" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="bold" fill="#1E3446">SELECT *</text>
  <g clip-path="url(#c0)">
    <rect x="384" y="16" width="200" height="70" fill="#1E3446"/>
  </g>
  <rect x="384" y="16" width="200" height="70" rx="12" fill="none" stroke="#A8C8D8" stroke-width="3"/>
  <use href="#mug" transform="translate(446.2 0.1) scale(0.19)"/>
  <!-- level 2 -->
