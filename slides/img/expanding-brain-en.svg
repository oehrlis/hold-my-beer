    <rect x="384" y="312" width="200" height="70" fill="#B85200"/>
    <path d="M496 347 L656 347 L654 372 Z M496 347 L644 408 L632 431 Z M496 347 L609 460 L590 476 Z M496 347 L557 495 L533 503 Z M496 347 L496 507 L471 505 Z M496 347 L435 495 L412 483 Z M496 347 L383 460 L367 441 Z M496 347 L348 408 L340 384 Z M496 347 L336 347 L338 322 Z M496 347 L348 286 L360 263 Z M496 347 L383 234 L402 218 Z M496 347 L435 199 L459 191 Z M496 347 L496 187 L521 189 Z M496 347 L557 199 L580 211 Z M496 347 L609 234 L625 253 Z M496 347 L644 286 L652 310 Z" fill="#FFC24A" opacity="0.55"/>
    <circle cx="496" cy="347.0" r="60" fill="url(#gg)"/>
