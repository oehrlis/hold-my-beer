  <path d="M566 349.0 Q566 361.0 578.0 361.0 Q566 361.0 566 373.0 Q566 361.0 554.0 361.0 Q566 361.0 566 349.0 Z" fill="#FFFFFF"/>
  <path d="M548 316.0 Q548 325.0 557.0 325.0 Q548 325.0 548 334.0 Q548 325.0 539.0 325.0 Q548 325.0 548 316.0 Z" fill="#FFFFFF"/>
  <path d="M430 358.0 Q430 367.0 439.0 367.0 Q430 367.0 430 376.0 Q430 367.0 421.0 367.0 Q430 367.0 430 358.0 Z" fill="#FFFFFF"/>
