    <circle cx="496" cy="199.0" r="52" fill="url(#gb)"/>
  </g>
  <rect x="384" y="164" width="200" height="70" rx="12" fill="none" stroke="#A8C8D8" stroke-width="3"/>
  <use href="#mug" transform="translate(446.2 148.1) scale(0.19)"/>
  <!-- level 4 -->
