  <text x="36" y="280" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E3446">asks the AI for the plan</text>
  <g clip-path="url(#c3)">
    <rect x="384" y="238" width="200" height="70" fill="#1E3446"/>
    <ellipse cx="496" cy="273.0" rx="90" ry="60" fill="url(#gw)"/>
  </g>
  <rect x="384" y="238" width="200" height="70" rx="12" fill="none" stroke="#A8C8D8" stroke-width="3"/>
  <use href="#mug" transform="translate(446.2 222.1) scale(0.19)"/>
  <!-- level 5 -->
  <rect x="16" y="312" width="356" height="70" rx="12" fill="#FFC24A"/>
  <text x="36" y="354" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E3446">asks the AI and reads the plan</text>
