    <circle cx="496" cy="125.0" r="34" fill="url(#gb)" opacity="0.5"/>
  </g>
  <rect x="384" y="90" width="200" height="70" rx="12" fill="none" stroke="#A8C8D8" stroke-width="3"/>
  <use href="#mug" transform="translate(446.2 74.1) scale(0.19)"/>
  <!-- level 3 -->
  <rect x="16" y="164" width="356" height="70" rx="12" fill="#F0F5F8"/>
  <text x="36" y="206" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E3446">reads the execution plan</text>
