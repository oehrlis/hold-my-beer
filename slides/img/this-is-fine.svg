<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">This is fine</title>
  <desc id="d">The hold-my-beer mug sits calmly on a stool next to a terminal showing alert.log, which is on fire with ORA- errors. Speech bubble: This is fine.</desc>
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#EF6C00"/>
    </linearGradient>
    <symbol id="fl" viewBox="0 0 40 64" overflow="visible">
      <path d="M20 0 C 30 18, 40 28, 40 44 A20 20 0 0 1 0 44 C 0 32, 10 24, 13 12 C 17 20, 18 24, 20 26 C 22 18, 22 10, 20 0 Z" fill="#EF6C00"/>
      <path d="M20 26 C 26 34, 30 40, 30 48 A10 10 0 0 1 10 48 C 10 42, 15 36, 20 26 Z" fill="#FFC24A"/>
    </symbol>
    <clipPath id="panel"><rect x="2" y="2" width="596" height="396" rx="24"/></clipPath>
  </defs>

  <rect x="2" y="2" width="596" height="396" rx="24" fill="#1E3446" stroke="#A8C8D8" stroke-width="3"/>

  <g clip-path="url(#panel)">
    <!-- smoke under the ceiling -->
    <path d="M0 0 H600 V40 C 560 58, 520 34, 480 50 C 440 66, 400 38, 360 54 C 320 70, 280 42, 240 58 C 200 74, 160 44, 120 60 C 80 76, 40 48, 0 64 Z" fill="#A8C8D8" opacity="0.22"/>
    <!-- flames along the back wall -->
    <use href="#fl" x="14" y="200" width="44" height="70"/>
    <use href="#fl" x="300" y="214" width="40" height="64"/>
    <use href="#fl" x="18" y="96" width="32" height="52" opacity="0.8"/>
    <use href="#fl" x="548" y="230" width="36" height="58" opacity="0.8"/>
    <!-- floor -->
    <rect x="0" y="340" width="600" height="60" fill="#A8C8D8" opacity="0.12"/>
    <line x1="0" y1="340" x2="600" y2="340" stroke="#A8C8D8" stroke-width="3"/>
  </g>

  <!-- desk -->
  <g stroke="#A8C8D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M56 260 H296"/>
    <path d="M76 262 V338"/>
    <path d="M276 262 V338"/>
  </g>

  <!-- flames rising out of the terminal -->
  <use href="#fl" x="66" y="40" width="56" height="90"/>
  <use href="#fl" x="118" y="14" width="66" height="106"/>
  <use href="#fl" x="182" y="34" width="56" height="90"/>
  <use href="#fl" x="230" y="64" width="40" height="64"/>

  <!-- terminal window -->
  <rect x="66" y="112" width="220" height="140" rx="12" fill="#F0F5F8" stroke="#A8C8D8" stroke-width="4" stroke-linejoin="round"/>
  <rect x="78" y="140" width="196" height="100" rx="6" fill="#1E3446"/>
  <circle cx="84" cy="126" r="4.5" fill="#EF6C00"/>
  <circle cx="98" cy="126" r="4.5" fill="#FFC24A"/>
  <circle cx="112" cy="126" r="4.5" fill="#A8C8D8"/>
  <text x="200" y="132" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#1E3446">alert.log</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold">
    <text x="88" y="164" fill="#FFC24A">ORA-00600</text>
    <text x="88" y="186" fill="#EF6C00">ORA-07445</text>
    <text x="88" y="208" fill="#FFC24A">ORA-04031</text>
    <text x="88" y="230" fill="#EF6C00">ORA-01555</text>
  </g>
  <!-- small flames licking the screen edge -->
  <use href="#fl" x="236" y="168" width="34" height="56"/>
  <use href="#fl" x="196" y="196" width="26" height="42"/>

  <!-- stool -->
  <g stroke="#A8C8D8" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M412 304 L398 338"/>
    <path d="M488 304 L502 338"/>
    <path d="M404 324 H496"/>
  </g>
  <rect x="392" y="294" width="116" height="14" rx="7" fill="#A8C8D8"/>

  <!-- the mug, calm (logo geometry, scaled) -->
  <g transform="translate(334 90) scale(0.5)">
    <path d="M330 220 C 410 220, 410 360, 330 360" fill="none" stroke="#A8C8D8" stroke-width="22" stroke-linecap="round"/>
    <path d="M150 175 L150 395 A90 24 0 0 0 330 395 L330 175 Z" fill="url(#beer)"/>
    <path d="M150 324 A90 24 0 0 0 330 324" fill="none" stroke="#B85200" stroke-width="6"/>
    <path d="M150 175 L150 395 A90 24 0 0 0 330 395 L330 175" fill="none" stroke="#A8C8D8" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="290" cy="372" r="6" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="302" cy="300" r="5" fill="#FFFFFF" opacity="0.6"/>
    <!-- closed, content eyes -->
    <g fill="none" stroke="#1E3446" stroke-width="8" stroke-linecap="round">
      <path d="M190 262 Q 206 250, 222 262"/>
      <path d="M258 262 Q 274 250, 290 262"/>
    </g>
    <text x="240" y="336" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="54" font-weight="bold" fill="#1E3446">&gt;_</text>
    <g fill="#F0F5F8">
      <ellipse cx="240" cy="175" rx="96" ry="26"/>
      <circle cx="168" cy="160" r="30"/>
      <circle cx="210" cy="145" r="36"/>
      <circle cx="258" cy="140" r="38"/>
      <circle cx="304" cy="156" r="32"/>
      <circle cx="335" cy="174" r="18"/>
      <path d="M150 170 L150 222 A12 12 0 0 0 174 222 L174 180 Z"/>
      <path d="M300 176 L300 204 A10 10 0 0 0 320 204 L320 180 Z"/>
    </g>
  </g>

  <!-- speech bubble -->
  <path d="M360 62 H560 A14 14 0 0 1 574 76 V120 A14 14 0 0 1 560 134 H470 L446 150 L450 134 H360 A14 14 0 0 1 346 120 V76 A14 14 0 0 1 360 62 Z" fill="#FFFFFF" stroke="#A8C8D8" stroke-width="3" stroke-linejoin="round"/>
  <text x="460" y="107" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1E3446">This is fine.</text>
</svg>
