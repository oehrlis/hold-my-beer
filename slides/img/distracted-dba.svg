<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">Distracted DBA</title>
  <desc id="d">A DBA with glasses, a grey tuft and a lanyard turns to stare at a shiny, sparkling AI robot walking by, while a thick book labelled Oracle Docs stands next to him with arms on its hips, glaring.</desc>
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFC24A" stop-opacity="0.55"/><stop offset="1" stop-color="#FFC24A" stop-opacity="0"/></radialGradient>
    <path id="spark" d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z"/>
  </defs>

  <rect x="2" y="2" width="596" height="396" rx="24" fill="#1E3446" stroke="#A8C8D8" stroke-width="3"/>
  <g transform="translate(0 16)">
  <line x1="30" y1="350" x2="570" y2="350" stroke="#A8C8D8" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== AI: shiny robot strolling by ===== -->
  <circle cx="130" cy="210" r="120" fill="url(#glow)"/>
  <g stroke="#A8C8D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M112 296 L100 348"/>
    <path d="M148 296 L164 348"/>
    <path d="M86 222 L60 256"/>
    <path d="M174 222 L204 196"/>
    <path d="M130 120 V100"/>
  </g>
  <circle cx="130" cy="96" r="7" fill="#FFC24A"/>
  <rect x="86" y="200" width="88" height="100" rx="16" fill="#FFC24A" stroke="#F0F5F8" stroke-width="3"/>
  <rect x="92" y="120" width="76" height="72" rx="16" fill="#F0F5F8" stroke="#A8C8D8" stroke-width="3"/>
  <rect x="102" y="132" width="56" height="46" rx="9" fill="#1E3446"/>
  <g fill="none" stroke="#FFC24A" stroke-width="4" stroke-linecap="round">
    <path d="M110 160 Q117 150 124 160"/>
    <path d="M136 160 Q143 150 150 160"/>
  </g>
  <text x="130" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1E3446">AI</text>
  <g fill="#FFFFFF">
    <use href="#spark" transform="translate(58 128) scale(1.3)"/>
    <use href="#spark" transform="translate(206 150)"/>
    <use href="#spark" transform="translate(56 300) scale(0.8)"/>
    <use href="#spark" transform="translate(196 286) scale(0.7)"/>
  </g>
  <g fill="#FFC24A">
    <use href="#spark" transform="translate(84 88) scale(0.6)"/>
    <use href="#spark" transform="translate(190 100) scale(0.9)"/>
  </g>

  <!-- ===== DBA: body walks with the docs, head turned to the AI ===== -->
  <g stroke="#A8C8D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M300 292 L294 348"/>
    <path d="M326 292 L336 348"/>
    <!-- arm reaching back to the docs -->
    <path d="M352 220 L380 258 L400 262"/>
    <!-- other arm hanging -->
    <path d="M272 220 L262 272"/>
  </g>
  <path d="M282 196 H342 A12 12 0 0 1 354 208 L358 296 H266 L270 208 A12 12 0 0 1 282 196 Z" fill="#7500C0" stroke="#A8C8D8" stroke-width="3" stroke-linejoin="round"/>
  <!-- lanyard + badge -->
  <path d="M296 198 L312 238 L328 198" fill="none" stroke="#FFC24A" stroke-width="4" stroke-linejoin="round"/>
  <rect x="288" y="236" width="48" height="30" rx="5" fill="#F0F5F8"/>
  <text x="312" y="257" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E3446">DBA</text>
  <!-- head -->
  <circle cx="312" cy="156" r="34" fill="#F0F5F8"/>
  <!-- grey tuft on the back of the head -->
  <path d="M318 124 Q326 108 332 124 Q340 112 342 130 Q352 124 346 142" fill="none" stroke="#A8C8D8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- glasses, eyes looking left at the AI -->
  <g fill="none" stroke="#1E3446" stroke-width="3">
    <circle cx="294" cy="152" r="10"/>
    <circle cx="320" cy="152" r="10"/>
    <path d="M304 152 H310"/>
    <path d="M330 150 L344 146"/>
  </g>
  <circle cx="289" cy="152" r="4" fill="#1E3446"/>
  <circle cx="315" cy="152" r="4" fill="#1E3446"/>
  <!-- impressed mouth -->
  <ellipse cx="300" cy="178" rx="5" ry="6" fill="#1E3446"/>
  <!-- head-turn motion lines -->
  <g fill="none" stroke="#FFC24A" stroke-width="3" stroke-linecap="round">
    <path d="M262 136 Q254 152 262 168"/>
    <path d="M250 130 Q240 152 250 174"/>
  </g>

  <!-- holding hands -->
  <circle cx="402" cy="262" r="6" fill="#A8C8D8"/>

  <!-- ===== Oracle Docs: thick book, offended ===== -->
  <g stroke="#A8C8D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M460 318 L456 348"/>
    <path d="M500 318 L506 348"/>
    <!-- arms on hips -->
    <path d="M424 238 L404 262"/>
    <path d="M558 226 L580 258 L558 284"/>
  </g>
  <!-- page block (thickness) -->
  <path d="M540 132 L556 144 V326 L540 318 Z" fill="#F0F5F8"/>
  <g stroke="#A8C8D8" stroke-width="2"><path d="M545 150 V318"/><path d="M550 154 V320"/></g>
  <rect x="420" y="132" width="122" height="188" rx="8" fill="#B85200" stroke="#EF6C00" stroke-width="3"/>
  <rect x="432" y="146" width="98" height="60" rx="4" fill="none" stroke="#FFC24A" stroke-width="2"/>
  <text x="481" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#F0F5F8">Oracle</text>
  <text x="481" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#F0F5F8">Docs</text>
  <!-- angry face -->
  <g stroke="#F0F5F8" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M446 226 L470 236"/>
    <path d="M516 226 L492 236"/>
    <path d="M462 290 Q481 276 500 290"/>
  </g>
  <circle cx="462" cy="248" r="6" fill="#F0F5F8"/>
  <circle cx="500" cy="248" r="6" fill="#F0F5F8"/>
  <!-- anger mark -->
  <g stroke="#EF6C00" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M560 96 Q566 106 576 106"/>
    <path d="M582 100 Q572 106 572 116"/>
    <path d="M576 122 Q570 112 560 112"/>
    <path d="M554 118 Q564 112 564 102"/>
  </g>
  </g>
</svg>
