<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">Distracted DBA</title>
  <desc id="d">Own take on the distracted boyfriend meme on a sunny old-town street: a DBA in a check shirt with glasses and a DBA badge holds hands with Oracle Docs, a thick book, but turns his head and whistles after a shiny orange AI robot walking by in the blurred foreground. Oracle Docs stares at him in shocked disbelief.</desc>
  <defs>
    <clipPath id="panel"><rect x="2" y="2" width="596" height="396" rx="24"/></clipPath>
    <filter id="bgblur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="fgblur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <radialGradient id="sun"><stop offset="0" stop-color="#FFC24A" stop-opacity="0.6"/><stop offset="1" stop-color="#FFC24A" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFC24A" stop-opacity="0.9"/><stop offset="1" stop-color="#FFC24A" stop-opacity="0"/></radialGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC24A"/><stop offset="1" stop-color="#EF6C00"/></linearGradient>
    <pattern id="plaid" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <rect width="26" height="26" fill="#F0F5F8"/>
      <rect width="11" height="26" fill="#A8C8D8" opacity="0.85"/>
      <rect width="26" height="11" fill="#A8C8D8" opacity="0.85"/>
      <rect x="4.5" width="2.5" height="26" fill="#1E3446"/>
      <rect y="4.5" width="26" height="2.5" fill="#1E3446"/>
      <rect x="18" width="1.5" height="26" fill="#7500C0" opacity="0.4"/>
    </pattern>
    <path id="spark" d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z"/>
    <g id="walker"><circle cx="0" cy="-34" r="6"/><rect x="-7" y="-26" width="14" height="26" rx="6"/></g>
  </defs>

  <rect x="2" y="2" width="596" height="396" rx="24" fill="#1E3446"/>

  <g clip-path="url(#panel)">
    <!-- ===== sunny old-town street, out of focus ===== -->
    <g filter="url(#bgblur)">
      <rect x="0" y="0" width="600" height="400" fill="#A8C8D8" opacity="0.14"/>
      <circle cx="520" cy="30" r="130" fill="url(#sun)"/>
      <g fill="#A8C8D8">
        <path d="M-10 300 V70 L55 22 L120 70 V300 Z" opacity="0.30"/>
        <path d="M120 300 V96 H228 V300 Z" opacity="0.20"/>
        <path d="M228 300 V64 L284 30 L340 64 V300 Z" opacity="0.30"/>
        <path d="M340 300 V88 H462 V300 Z" opacity="0.20"/>
        <path d="M462 300 V56 L531 14 L610 56 V300 Z" opacity="0.30"/>
      </g>
      <g fill="#1E3446" opacity="0.55">
        <rect x="14" y="96" width="22" height="30" rx="3"/><rect x="74" y="96" width="22" height="30" rx="3"/>
        <rect x="14" y="152" width="22" height="30" rx="3"/><rect x="74" y="152" width="22" height="30" rx="3"/>
        <rect x="140" y="120" width="20" height="28" rx="3"/><rect x="188" y="120" width="20" height="28" rx="3"/>
        <rect x="140" y="172" width="20" height="28" rx="3"/><rect x="188" y="172" width="20" height="28" rx="3"/>
        <rect x="250" y="90" width="22" height="30" rx="3"/><rect x="296" y="90" width="22" height="30" rx="3"/>
        <rect x="360" y="110" width="22" height="30" rx="3"/><rect x="420" y="110" width="22" height="30" rx="3"/>
        <rect x="360" y="166" width="22" height="30" rx="3"/><rect x="420" y="166" width="22" height="30" rx="3"/>
        <rect x="484" y="86" width="22" height="30" rx="3"/><rect x="548" y="86" width="22" height="30" rx="3"/>
        <rect x="484" y="146" width="22" height="30" rx="3"/><rect x="548" y="146" width="22" height="30" rx="3"/>
      </g>
      <!-- shop awnings -->
      <g opacity="0.5">
        <path d="M128 222 H220 L228 242 H120 Z" fill="#EF6C00"/>
        <path d="M348 214 H454 L462 236 H340 Z" fill="#FFC24A"/>
        <path d="M470 220 H596 L604 242 H462 Z" fill="#B85200"/>
      </g>
      <!-- pavement -->
      <path d="M0 300 H600 V400 H0 Z" fill="#A8C8D8" opacity="0.10"/>
      <path d="M0 300 H600" stroke="#A8C8D8" stroke-width="3" opacity="0.4"/>
      <!-- passers-by -->
      <g fill="#A8C8D8" opacity="0.45">
        <use href="#walker" transform="translate(214 298)"/>
        <use href="#walker" transform="translate(396 296) scale(0.9)"/>
        <use href="#walker" transform="translate(424 300)"/>
        <use href="#walker" transform="translate(586 298) scale(0.9)"/>
      </g>
      <use href="#walker" transform="translate(410 304) scale(0.8)" fill="#EF6C00" opacity="0.4"/>
    </g>

    <!-- ===== LEFT FOREGROUND: the AI walking away, slightly out of focus ===== -->
    <g filter="url(#fgblur)">
      <circle cx="96" cy="270" r="110" fill="url(#glow)" opacity="0.55"/>
      <!-- swinging arm -->
      <path d="M170 222 Q196 276 186 334" fill="none" stroke="#1E3446" stroke-width="26" stroke-linecap="round"/>
      <path d="M170 222 Q196 276 186 334" fill="none" stroke="#A8C8D8" stroke-width="19" stroke-linecap="round"/>
      <circle cx="186" cy="338" r="13" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
      <!-- body -->
      <path d="M-20 420 L-14 238 Q-10 196 34 190 H150 Q184 196 186 236 L192 420 Z" fill="url(#beer)" stroke="#1E3446" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M8 240 Q10 210 36 206" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
      <!-- neck + head -->
      <rect x="70" y="164" width="44" height="34" rx="8" fill="#A8C8D8" stroke="#1E3446" stroke-width="3.5"/>
      <path d="M92 62 V40" stroke="#1E3446" stroke-width="5" stroke-linecap="round"/>
      <circle cx="92" cy="36" r="9" fill="#FFC24A" stroke="#1E3446" stroke-width="3"/>
      <rect x="34" y="60" width="118" height="112" rx="48" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
      <!-- visor on the far (left) side: it looks ahead, away from us -->
      <path d="M34 96 H70 Q80 96 80 108 V126 Q80 138 70 138 H34 Z" fill="#1E3446"/>
      <rect x="40" y="110" width="22" height="9" rx="4.5" fill="#FFC24A"/>
      <circle cx="132" cy="116" r="13" fill="#A8C8D8" stroke="#1E3446" stroke-width="3"/>
      <path d="M58 74 Q90 64 120 72" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <!-- glowing AI label -->
      <rect x="36" y="248" width="104" height="66" rx="16" fill="#FFC24A" stroke="#F0F5F8" stroke-width="4"/>
      <text x="88" y="296" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1E3446">AI</text>
    </g>
    <g fill="#FFFFFF">
      <use href="#spark" transform="translate(22 40) scale(1.2)"/>
      <use href="#spark" transform="translate(182 84)"/>
      <use href="#spark" transform="translate(196 186) scale(0.7)"/>
    </g>
    <g fill="#FFC24A">
      <use href="#spark" transform="translate(166 30) scale(0.7)"/>
      <use href="#spark" transform="translate(16 200) scale(0.8)"/>
    </g>

    <!-- ===== CENTRE: the DBA, body walking right, head turned back ===== -->
    <!-- far arm hanging -->
    <path d="M246 248 Q232 306 236 372" fill="none" stroke="#1E3446" stroke-width="34" stroke-linecap="round"/>
    <path d="M246 248 Q232 306 236 372" fill="none" stroke="url(#plaid)" stroke-width="27" stroke-linecap="round"/>
    <circle cx="236" cy="380" r="13" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
    <!-- torso -->
    <path d="M232 420 L236 258 Q240 222 274 214 H336 Q370 222 376 258 L384 420 Z" fill="url(#plaid)" stroke="#1E3446" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- neck + collar -->
    <path d="M280 184 V218 H322 V184 Z" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
    <path d="M280 210 L302 240 L292 210 Z M324 210 L302 240 L312 210 Z" fill="#A8C8D8" stroke="#1E3446" stroke-width="3" stroke-linejoin="round"/>
    <!-- lanyard + badge -->
    <path d="M284 216 L304 300 L322 216" fill="none" stroke="#EF6C00" stroke-width="6" stroke-linejoin="round"/>
    <rect x="268" y="296" width="72" height="44" rx="7" fill="#FFFFFF" stroke="#1E3446" stroke-width="3.5"/>
    <rect x="296" y="300" width="16" height="5" rx="2.5" fill="#1E3446"/>
    <text x="304" y="331" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E3446">DBA</text>
    <!-- near arm reaching back to Oracle Docs -->
    <path d="M360 244 Q392 284 408 330" fill="none" stroke="#1E3446" stroke-width="34" stroke-linecap="round"/>
    <path d="M360 244 Q392 284 408 330" fill="none" stroke="url(#plaid)" stroke-width="27" stroke-linecap="round"/>
    <!-- head, turned left towards the AI -->
    <circle cx="300" cy="146" r="46" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
    <ellipse cx="342" cy="152" rx="9" ry="13" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
    <!-- grey hair on the back of the head + tuft -->
    <path d="M276 106 Q300 92 326 102 Q348 114 348 140 L340 140 Q336 118 316 112 Q296 108 280 116 Z" fill="#A8C8D8" stroke="#1E3446" stroke-width="3" stroke-linejoin="round"/>
    <path d="M300 102 Q298 84 310 80 M308 102 Q312 86 324 86 M292 104 Q284 90 290 82" fill="none" stroke="#A8C8D8" stroke-width="6" stroke-linecap="round"/>
    <!-- raised eyebrows -->
    <g fill="none" stroke="#1E3446" stroke-width="4" stroke-linecap="round">
      <path d="M256 120 Q266 110 278 116"/>
      <path d="M290 118 Q302 108 314 116"/>
    </g>
    <!-- round glasses, eyes on the AI -->
    <g fill="#FFFFFF" fill-opacity="0.5" stroke="#1E3446" stroke-width="3.5">
      <circle cx="268" cy="140" r="13"/>
      <circle cx="302" cy="140" r="13"/>
    </g>
    <path d="M281 140 H289 M315 138 L334 146" fill="none" stroke="#1E3446" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="262" cy="140" r="5" fill="#1E3446"/>
    <circle cx="296" cy="140" r="5" fill="#1E3446"/>
    <!-- nose + pursed whistling lips -->
    <path d="M256 148 Q248 160 258 164" fill="none" stroke="#1E3446" stroke-width="3" stroke-linecap="round"/>
    <circle cx="260" cy="178" r="6.5" fill="#EF6C00" stroke="#1E3446" stroke-width="3"/>
    <!-- whistle notes -->
    <g fill="#FFC24A" stroke="#FFC24A" stroke-width="3" stroke-linecap="round">
      <ellipse cx="216" cy="182" rx="6" ry="4.5" stroke="none"/>
      <path d="M221 181 V158 Q228 162 232 168" fill="none"/>
      <ellipse cx="232" cy="210" rx="5" ry="4" stroke="none"/>
      <path d="M236 209 V192" fill="none"/>
    </g>
    <!-- head-turn motion lines -->
    <g fill="none" stroke="#FFC24A" stroke-width="3.5" stroke-linecap="round">
      <path d="M362 116 Q372 140 362 166"/>
      <path d="M374 108 Q388 140 374 174"/>
    </g>

    <!-- ===== RIGHT: Oracle Docs, shocked ===== -->
    <!-- page block (thickness) on the side facing the DBA -->
    <path d="M452 116 L432 130 V420 H452 Z" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5" stroke-linejoin="round"/>
    <g stroke="#A8C8D8" stroke-width="2"><path d="M438 134 V420"/><path d="M444 130 V420"/></g>
    <rect x="452" y="108" width="140" height="320" rx="12" fill="#B85200" stroke="#1E3446" stroke-width="3.5"/>
    <rect x="460" y="116" width="124" height="312" rx="8" fill="none" stroke="#EF6C00" stroke-width="3"/>
    <rect x="468" y="126" width="108" height="66" rx="5" fill="none" stroke="#FFC24A" stroke-width="2.5"/>
    <text x="522" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#F0F5F8">Oracle</text>
    <text x="522" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#F0F5F8">Docs</text>
    <!-- shocked eyebrows, wide eyes looking at the DBA -->
    <g fill="none" stroke="#F0F5F8" stroke-width="4.5" stroke-linecap="round">
      <path d="M478 212 Q490 200 504 208"/>
      <path d="M532 206 Q546 198 558 210"/>
    </g>
    <g fill="#FFFFFF" stroke="#1E3446" stroke-width="3">
      <circle cx="492" cy="234" r="15"/>
      <circle cx="542" cy="234" r="15"/>
    </g>
    <circle cx="485" cy="234" r="6" fill="#1E3446"/>
    <circle cx="535" cy="234" r="6" fill="#1E3446"/>
    <!-- open mouth -->
    <ellipse cx="516" cy="292" rx="16" ry="23" fill="#1E3446" stroke="#F0F5F8" stroke-width="3"/>
    <ellipse cx="516" cy="304" rx="9" ry="7" fill="#EF6C00"/>
    <!-- shock marks -->
    <g fill="none" stroke="#FFC24A" stroke-width="4" stroke-linecap="round">
      <path d="M560 82 L568 64"/><path d="M576 92 L592 80"/><path d="M542 78 L540 60"/>
    </g>
    <!-- arm to the DBA, holding hands -->
    <path d="M454 300 Q438 320 422 334" fill="none" stroke="#1E3446" stroke-width="22" stroke-linecap="round"/>
    <path d="M454 300 Q438 320 422 334" fill="none" stroke="#B85200" stroke-width="15" stroke-linecap="round"/>
    <circle cx="424" cy="336" r="13" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
    <circle cx="410" cy="334" r="13" fill="#F0F5F8" stroke="#1E3446" stroke-width="3.5"/>
  </g>

  <rect x="2" y="2" width="596" height="396" rx="24" fill="none" stroke="#A8C8D8" stroke-width="3"/>
</svg>
