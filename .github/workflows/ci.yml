# CI: every job calls the same make target as on the Mac (docs/ci-release.md). release.yml calls it again
# on the tag commit (workflow_call).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARKDOWNLINT_VERSION: "0.50.0"
  SHELLCHECK_VERSION: "0.11.0"
  TERRAFORM_VERSION: "1.17.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install markdownlint and shellcheck
        run: |
          npm install -g "markdownlint-cli@${MARKDOWNLINT_VERSION}"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      # make lint skips a missing linter with a WARN - in CI a missing tool is an error
      - name: Check tools
        run: |
          markdownlint --version
          shellcheck --version | sed -n 2p
          terraform version | head -1
      - run: make lint

  # Python 3.9 as on the hosts: OL9 system python in an oraclelinux:9 container (setup-python no longer
  # ships 3.9 for current Ubuntu runners). requirements.lock is tested there.
  test-ol9:
    runs-on: ubuntu-latest
    container: oraclelinux:9
    steps:
      - name: OS packages
        run: dnf install -y -q python3 python3-pip make git tar curl iproute procps-ng findutils
      - uses: actions/checkout@v7
      - run: python3 --version
      - run: make app-venv app-test

  # early warning for a newer python
  test-py312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make app-venv app-test

  smoke:
    runs-on: ubuntu-latest
    container: oraclelinux:9
    needs: test-ol9
    steps:
      - name: OS packages
        run: dnf install -y -q python3 python3-pip make git tar curl iproute procps-ng findutils
      - uses: actions/checkout@v7
      - run: make app-smoke
      - name: App log on failure
        if: failure()
        run: tail -n 80 app/logs/app.log || true
