# Release on a tag push (docs/ci-release.md). The tag comes from 'make release VERSION=x.y.z' only - never tag by
# hand. Guard first, then the full checks again on the tag commit, then the GitHub release with assets.
# No deploy from here: a deploy stays a manual step against a named host.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches VERSION and its commit is on main
        run: |
          want="v$(cat VERSION)"
          [ "${GITHUB_REF_NAME}" = "${want}" ] \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (${want})"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::tag commit ${GITHUB_SHA} is not on main - orphaned or mistyped tag"; exit 1; }

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  secrets:
    needs: guard
    uses: ./.github/workflows/secrets.yml

  iac:
    needs: guard
    uses: ./.github/workflows/iac.yml

  publish:
    needs: [ci, secrets, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the app package
        run: |
          pkg="$(app/package.sh | tail -1)"
          cp "app/${pkg}" .
          sha256sum "$(basename "${pkg}")" > "$(basename "${pkg}").sha256"
          echo "PKG=$(basename "${pkg}")" >> "${GITHUB_ENV}"
      - name: Release notes from the CHANGELOG section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="${ver}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG section for ${ver}"; exit 1; }
          echo "DAY=$(grep -m1 -E "^## \[${ver}\]" CHANGELOG.md | sed -E 's/.* - //')" >> "${GITHUB_ENV}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" ${pre} --verify-tag \
            --title "${GITHUB_REF_NAME} - ${DAY}" --notes-file notes.md \
            "${PKG}" "${PKG}.sha256" slides/doag-ak-2026/wissen-nicht-was-sie-tun.html
