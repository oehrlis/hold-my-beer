# Topic pool DOAG AK 2026 - single source for the voting app seed and the round slides.
# Schema: pool/README.md. Draft table and rationale: pool/doag-ak-2026.md.
# Owner values: Stefan | Martin | Gemeinsam | Offen. Difficulty: Leicht | Mittel | Schwer. Risk: Niedrig | Mittel | Hoch.
schema: 1
event:
  name: DOAG Anwenderkonferenz 2026
  short: DOAG AK 2026
  city: Nürnberg
  date: 2026-11-17
  time: "15:00-15:45"
  room: Istanbul
  duration_min: 45
  lang: de
  title: "Denn sie wissen nicht was sie tun - Oracle live mit Oehrli, Berger und KI"
  title_en: "They Know Not What They Do - Oracle live with Oehrli, Berger and AI"  # proposal

format:
  voting_seconds: 60
  challenge_minutes: 5
  scorecard:
    - AI richtig
    - AI halluziniert
    - Falsches Problem gelöst
    - DBA-Instinkt gewinnt
  scorecard_en:
    - AI right
    - AI hallucinated
    - Solved the wrong problem
    - DBA instinct wins

rounds:
  - number: 1
    name: Warm-up
    name_en: Warm-up
    options:
      - key: A
        title: 10G-Passwort-Verifier finden und bereinigen
        title_en: Find and clean up 10G password verifiers
        owner: Stefan
        category: Security
        category_en: Security
        difficulty: Leicht
        risk: Niedrig
        ai_pitfall: falsche Spalten, PASSWORD_VERSIONS ungenau
      - key: B
        title: Shell Health-Check für Alert-Log und Listener
        title_en: Shell health check for alert log and listener
        owner: Martin
        category: Betrieb
        category_en: Operations
        difficulty: Leicht
        risk: Niedrig
        ai_pitfall: kein set -euo pipefail, Oracle-Umgebung nicht gesetzt
      - key: C
        title: Data Pump Export/Import mit Remap
        title_en: Data Pump export/import with remap
        owner: Gemeinsam
        category: Betrieb
        category_en: Operations
        difficulty: Leicht
        risk: Niedrig
        ai_pitfall: veraltete exp/imp-Muster
  - number: 2
    name: DBA-Alltag
    name_en: Everyday DBA work
    options:
      - key: A
        title: Unified Audit Policy für privilegierte User inklusive NOAUDIT
        title_en: Unified Audit policy for privileged users, including NOAUDIT
        owner: Stefan
        category: Security
        category_en: Security
        difficulty: Mittel
        risk: Niedrig
        ai_pitfall: Syntax-Mix Traditional/Unified, NOAUDIT vergessen
      - key: B
        title: "AWR/ASH: Slow Query analysieren"
        title_en: "AWR/ASH: analyze a slow query"
        owner: Martin
        category: Performance
        category_en: Performance
        difficulty: Mittel
        risk: Mittel
        ai_pitfall: löst das falsche Problem, Index statt Plan-Analyse
      - key: C
        title: Listener und sqlnet.ora Hardening
        title_en: Listener and sqlnet.ora hardening
        owner: Gemeinsam
        category: Security
        category_en: Security
        difficulty: Leicht
        risk: Niedrig
        ai_pitfall: Parameter pro Release verwechselt
  - number: 3
    name: Bruchstelle
    name_en: Breaking point
    options:
      - key: A
        title: TDE-Keystore mit WALLET_ROOT
        title_en: TDE keystore with WALLET_ROOT
        owner: Stefan
        category: Security
        category_en: Security
        difficulty: Mittel
        risk: Mittel
        ai_pitfall: alte sqlnet.ora ENCRYPTION_WALLET_LOCATION-Syntax
      - key: B
        title: Data Guard Switchover mit DGMGRL
        title_en: Data Guard switchover with DGMGRL
        owner: Martin
        category: Hochverfügbarkeit
        category_en: High availability
        difficulty: Schwer
        risk: Hoch
        ai_pitfall: überspringt VALIDATE und Vorprüfung
      - key: C
        title: "AI-Code-Review: fehlerhaftes PL/SQL untersuchen"
        title_en: "AI code review: examine faulty PL/SQL"
        owner: Gemeinsam
        category: Code Review
        category_en: Code review
        difficulty: Mittel
        risk: Niedrig
        ai_pitfall: übersieht Logikfehler

