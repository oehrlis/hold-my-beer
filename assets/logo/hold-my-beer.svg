<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Hold my beer - Oracle live, with AI</title>
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#EF6C00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="#1E3446"/>

  <!-- handle -->
  <path d="M330 220 C 410 220, 410 360, 330 360" fill="none" stroke="#A8C8D8" stroke-width="26" stroke-linecap="round"/>

  <!-- mug = database cylinder -->
  <path d="M150 175 L150 395 A90 24 0 0 0 330 395 L330 175 Z" fill="url(#beer)"/>
  <rect x="172" y="190" width="26" height="200" rx="13" fill="url(#shine)"/>
  <path d="M150 252 A90 24 0 0 0 330 252" fill="none" stroke="#B85200" stroke-width="6"/>
  <path d="M150 324 A90 24 0 0 0 330 324" fill="none" stroke="#B85200" stroke-width="6"/>
  <path d="M150 175 L150 395 A90 24 0 0 0 330 395 L330 175" fill="none" stroke="#A8C8D8" stroke-width="8" stroke-linejoin="round"/>

  <!-- bubbles -->
  <circle cx="290" cy="372" r="6" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="302" cy="300" r="4" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="284" cy="228" r="5" fill="#FFFFFF" opacity="0.6"/>

  <!-- prompt -->
  <text x="240" y="330" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="54" font-weight="bold" fill="#1E3446">&gt;_</text>

  <!-- foam, spilling over the rim -->
  <g fill="#F0F5F8">
    <ellipse cx="240" cy="175" rx="96" ry="26"/>
    <circle cx="168" cy="160" r="30"/>
    <circle cx="210" cy="145" r="36"/>
    <circle cx="258" cy="140" r="38"/>
    <circle cx="304" cy="156" r="32"/>
    <circle cx="335" cy="174" r="18"/>
    <path d="M150 170 L150 222 A12 12 0 0 0 174 222 L174 180 Z"/>
    <path d="M300 176 L300 204 A10 10 0 0 0 320 204 L320 180 Z"/>
  </g>

  <text x="256" y="472" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="3" fill="#F0F5F8">HOLD MY BEER</text>
</svg>
