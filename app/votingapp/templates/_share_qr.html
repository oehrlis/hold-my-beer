{% set share = share_url() %}
<details class="share-qr">
  <summary aria-label="QR-Code zur Teilnahme anzeigen" title="QR-Code zur Teilnahme anzeigen">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="currentColor">
      <path d="M2 2h8v8H2V2zm2 2v4h4V4H4zm10-2h8v8h-8V2zm2 2v4h4V4h-4zM2 14h8v8H2v-8zm2 2v4h4v-4H4zm10-2h3v3h-3v-3zm5 0h3v3h-3v-3zm-5 5h3v3h-3v-3zm5 0h3v3h-3v-3z"/>
    </svg>
  </summary>
  <div class="share-qr-panel">
    <img src="{{ url_for('screen.share_qr') }}" alt="QR-Code für {{ share }}" width="480" height="480">
    <a href="{{ share }}">{{ share }}</a>
  </div>
</details>
